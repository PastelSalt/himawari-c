# CI skeleton (plan §14.6). Windows only (plan v0.5): every job runs on windows-latest.
# Jobs: ts, i18n, runtime-win (shipping build), runtime-asan (ASan/UBSan + libFuzzer),
# studio (Playwright e2e with the P1 budgets, and the Windows installer). Later: release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Never let corepack stop to ask before downloading pnpm.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (typecheck, lint, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm comes from corepack in the next step, so skip setup-node's automatic
          # pnpm cache (it runs before pnpm exists and fails the job).
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Tests (the assistant's prompt-cache check runs only when the ANTHROPIC_API_KEY secret is set)
        run: pnpm test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  i18n:
    name: Studio UI strings (EN/JA in sync)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm comes from corepack in the next step, so skip setup-node's automatic
          # pnpm cache (it runs before pnpm exists and fails the job).
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:i18n

  runtime-win:
    name: Runtime, Windows (shipping build, MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure and build (win64-release)
        run: |
          cmake --preset win64-release
          cmake --build --preset win64-release
      - name: Unit tests
        run: ctest --preset win64-release
      - name: Check the .exe files import no non-system DLLs
        run: |
          for exe in himawari spike_a; do
            objdump -p build/win64-release/$exe.exe | grep "DLL Name" | tee imports.txt
            if grep -Eiv "DLL Name: (kernel32|user32|gdi32|winmm|imm32|ole32|oleaut32|version|uuid|advapi32|setupapi|shell32|dinput8|cfgmgr32|hid|api-ms-win-[a-z0-9-]+)\.dll" imports.txt; then
              echo "::error::$exe.exe imports a non-system DLL"; exit 1
            fi
          done
      - name: Player smoke test (window, title, a few lines, a menu; dummy audio)
        env:
          SDL_AUDIO_DRIVER: dummy
        run: |
          ./build/win64-release/himawari.exe --headless ../tests/conformance/cases/basic/expected.hwb --playtest
          ./build/win64-release/himawari.exe ../tests/conformance/cases/l10n/expected.hwb --lang ja --start --frames 240 --advance 4 --screenshot player-ja.png
          test -s player-ja.png
      - name: Spike A smoke test (window, audio on the dummy driver, JP text)
        env:
          SDL_AUDIO_DRIVER: dummy
        run: ./build/win64-release/spike_a.exe --frames 60
      - name: Spike B smoke test (GPU rule wipe, or the crossfade fallback on a GPU-less runner)
        run: ./build/win64-release/spike_b.exe --frames 60
      - name: Spike C kinsoku check on real font metrics (needs Yu Gothic on the runner)
        run: |
          if [ -f /c/Windows/Fonts/YuGothM.ttc ]; then
            for w in 600 900 1200 1600; do ./build/win64-release/spike_c_ft.exe --check-only --width $w; done
          else
            echo "::notice::Yu Gothic not installed on this runner; skipped (test_layout still ran under ctest)"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: spikes-windows-x64
          path: |
            runtime/build/win64-release/himawari.exe
            runtime/player-ja.png
            runtime/build/win64-release/spike_a.exe
            runtime/build/win64-release/spike_b.exe
            runtime/build/win64-release/spike_c_ft.exe
            runtime/build/win64-release/spike_c_ttf.exe

  runtime-asan:
    name: Runtime, Windows (ASan/UBSan + libFuzzer, MSYS2 CLANG64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
      - name: Build and test under ASan + UBSan (win64-asan)
        run: |
          cmake --preset win64-asan
          cmake --build --preset win64-asan
          ctest --preset win64-asan
      - name: Fuzz (regressions, then 60 s per target, win64-fuzz)
        run: |
          cmake --preset win64-fuzz
          cmake --build --preset win64-fuzz
          ctest --preset win64-fuzz
          ./build/win64-fuzz/fuzz_utf8.exe -max_total_time=60
          ./build/win64-fuzz/fuzz_json.exe -max_total_time=60
          mkdir -p corpus-hwb
          for c in ../tests/conformance/cases/*/; do
            if [ -f "$c/expected.hwb" ]; then cp "$c/expected.hwb" "corpus-hwb/$(basename "$c").hwb"; fi
          done
          ./build/win64-fuzz/fuzz_hwb.exe -max_total_time=60 corpus-hwb
          mkdir -p corpus-save && HW_WRITE_SAVE=corpus-save/basic.hwsav ./build/win64-fuzz/test_save.exe
          ./build/win64-fuzz/fuzz_save.exe -max_total_time=60 corpus-save

  studio:
    name: Studio (e2e + P1 budgets, Windows installer)
    runs-on: windows-latest
    needs: runtime-win
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: spikes-windows-x64
          path: runtime
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - name: Fetch the Electron binary
        run: node packages/studio/node_modules/electron/install.js
      - name: End to end (first run, edit → preview under 1 s, export, Japanese UI)
        run: pnpm --filter @himawari/studio e2e
      - name: Package (NSIS installer and portable)
        run: pnpm --filter @himawari/studio package
      - uses: actions/upload-artifact@v7
        with:
          name: himawari-studio-windows-x64
          path: |
            packages/studio/release/*.exe
