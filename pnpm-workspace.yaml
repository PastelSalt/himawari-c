packages:
  - packages/*
# Install scripts are blocked unless allowed here. electron-winstaller (Squirrel) isn't used:
# Studio ships with NSIS (plan §14.5). Electron itself downloads its binary on first use.
allowBuilds:
  electron-winstaller: false
# global-agent is an optional dependency of @electron/get (via electron-builder), used only for
# downloads through a proxy (ELECTRON_GET_USE_PROXY). It brings in sprintf-js 1.1.3
# (GHSA-hp3w-g68c-fv3c, no fixed release). Without it, packaging still works; only proxy
# downloads during packaging lose that support.
minimumReleaseAgeExclude:
  - electron@45.0.0
  - "@anthropic-ai/sdk@1.1.0"
overrides:
  global-agent: "-"
